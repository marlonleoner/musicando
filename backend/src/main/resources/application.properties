spring.application.name=Musicando

# Regras das salas
musicando.room.max-players=${ROOM_MAX_PLAYERS:12}
musicando.room.min-players=${ROOM_MIN_PLAYERS:1}

# Integração com a Deezer
musicando.deezer.base-url=${DEEZER_BASE_URL:https://api.deezer.com}
# Perfil cujas playlists públicas aparecem para o VIP (obrigatório: o backend não sobe sem ele)
musicando.deezer.user-id=${DEEZER_USER_ID:}

# Ciclo das rodadas
musicando.game.countdown=${GAME_COUNTDOWN:3s}
musicando.game.reveal=${GAME_REVEAL:5s}
musicando.game.fastest-limit=${GAME_FASTEST_LIMIT:5}

# Limpeza automática de salas
musicando.cleanup.interval=${CLEANUP_INTERVAL:5m}
musicando.cleanup.abandoned-after=${CLEANUP_ABANDONED_AFTER:30m}
musicando.cleanup.closed-retention=${CLEANUP_CLOSED_RETENTION:24h}

# Migrations do banco. Bancos criados antes do Flyway são marcados como versão 1 e recebem só as migrations seguintes.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Limites de uso (por IP na API e por participante no socket)
musicando.rate-limit.room-creations-per-minute=${RATE_LIMIT_ROOM_CREATIONS:10}
musicando.rate-limit.room-joins-per-minute=${RATE_LIMIT_ROOM_JOINS:20}
musicando.rate-limit.commands-per-second=${RATE_LIMIT_COMMANDS:20}
musicando.rate-limit.music-searches-per-minute=${RATE_LIMIT_MUSIC_SEARCHES:60}
