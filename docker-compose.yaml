# Ambiente completo em containers: backend, Redis e os dois apps (TV e celular).
# TV: http://localhost:8081 | Celular: http://localhost:8082 (ou o IP da máquina, para abrir no celular)

services:
  backend:
    container_name: musicando-backend
    build:
      context: backend
    restart: unless-stopped
    volumes:
      - ./database:/musicando-backend/database
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD
      - REDIS_DATABASE
      - CORS_ALLOWED_ORIGINS
      - ROOM_MAX_PLAYERS
      - ROOM_MIN_PLAYERS
    depends_on:
      - redis
    networks:
      - musicando-network

  host-app:
    container_name: musicando-host
    build:
      context: frontend
      args:
        APP: host-app
        VITE_PLAYER_APP_URL: ${PLAYER_APP_URL:-http://localhost:8082}
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://backend:8080
    ports:
      - "8081:8080"
    depends_on:
      - backend
    networks:
      - musicando-network

  player-app:
    container_name: musicando-player
    build:
      context: frontend
      args:
        APP: player-app
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://backend:8080
    ports:
      - "8082:8080"
    depends_on:
      - backend
    networks:
      - musicando-network

  redis:
    container_name: musicando-redis
    image: redis:alpine
    restart: unless-stopped
    command: /bin/sh -c "redis-server --requirepass $$REDIS_PASSWORD"
    environment:
      - REDIS_PASSWORD
    networks:
      - musicando-network

networks:
  musicando-network:
    driver: bridge
